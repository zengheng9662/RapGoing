<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>912 RAP GOING · 疯狂泳池派对</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <main class="page-shell">
    <!-- 总入口密码 -->
    <section id="gate-panel" class="hub-panel gate-panel" aria-labelledby="gate-title">
      <header class="hub-header">
        <div class="eyebrow">09 · 12</div>
        <h1 id="gate-title"><span>RAP</span> GOING</h1>
        <p>疯狂泳池派对</p>
      </header>

      <div class="gate-content">
        <div class="lock-icon" aria-hidden="true">🔒</div>
        <div class="gate-copy">
          <strong>活动入口</strong>
          <span>输入四位数字口令</span>
        </div>

        <form id="gate-form" class="gate-form">
          <input
            id="gate-input"
            class="pin-input"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            autocomplete="off"
            aria-label="四位数字口令"
            placeholder="••••"
          />
          <div id="gate-error" class="error-text" role="alert"></div>
          <button class="glow-button" type="submit">进入</button>
        </form>
      </div>

      <footer class="hub-footer">912 · RAP GOING</footer>
    </section>

    <!-- 游戏总入口 -->
    <section id="hub-panel" class="hub-panel is-hidden" aria-labelledby="page-title">
      <header class="hub-header">
        <div class="eyebrow">09 · 12</div>
        <h1 id="page-title"><span>RAP</span> GOING</h1>
        <p>疯狂泳池派对</p>
      </header>

      <div class="game-list" aria-label="活动入口">
        <a class="game-card" href="secret-task/">
          <div class="game-icon" aria-hidden="true">🕵️</div>
          <div class="game-copy">
            <strong>秘密任务</strong>
            <span>SECRET MISSION</span>
          </div>
          <div class="game-arrow" aria-hidden="true">→</div>
        </a>

        <a class="game-card" href="childhood/">
          <div class="game-icon" aria-hidden="true">📷</div>
          <div class="game-copy">
            <strong>童年回忆</strong>
            <span>CHILDHOOD MEMORY</span>
          </div>
          <div class="game-arrow" aria-hidden="true">→</div>
        </a>

        <a class="game-card" href="invitation/">
          <div class="game-icon" aria-hidden="true">💌</div>
          <div class="game-copy">
            <strong>邀请函</strong>
            <span>INVITATION</span>
          </div>
          <div class="game-arrow" aria-hidden="true">→</div>
        </a>
      </div>

      <footer class="hub-footer">912 · RAP GOING</footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
