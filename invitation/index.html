<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="RAP GOING 2026 疯狂泳池派对专属邀请函" />
  <title>RAP GOING 2026 · 疯狂泳池派对</title>
  <link rel="preload" as="image" href="./assets/logo.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="app-shell">
    <section id="homeView" class="view is-active" aria-labelledby="homeTitle">
      <div class="home-card">
        <img class="hero-logo" src="./assets/logo.png" alt="RAP GOING" draggable="false" />
        <h1 id="homeTitle" class="sr-only">RAP GOING 2026 疯狂泳池派对</h1>
        <div class="party-meta" aria-label="活动信息">
          <p class="year">2026</p>
          <p class="dates">9.12 <span>14:00</span> <i>→</i> 9.13 <span>12:00</span></p>
          <p class="party-name">疯狂泳池派对</p>
        </div>
        <button id="getInvitationBtn" class="neon-button primary" type="button">
          <span>获取邀请函</span>
        </button>
      </div>
    </section>

    <section id="lookupView" class="view" aria-labelledby="lookupTitle">
      <div class="lookup-card">
        <img class="mini-logo" src="./assets/logo.png" alt="RAP GOING" draggable="false" />
        <h2 id="lookupTitle" class="sr-only">输入昵称获取邀请函</h2>

        <form id="nicknameForm" class="nickname-form" novalidate>
          <label class="sr-only" for="nicknameInput">输入你的昵称</label>
          <div id="inputWrap" class="input-wrap">
            <input
              id="nicknameInput"
              name="nickname"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              maxlength="20"
              placeholder="输入你的昵称"
              aria-describedby="formHint"
            />
          </div>
          <p id="formHint" class="form-hint" aria-live="polite"></p>
          <button class="neon-button primary submit-btn" type="submit">
            <span>打开邀请函</span>
          </button>
        </form>

        <div id="matchingPanel" class="matching-panel" aria-live="polite" aria-hidden="true">
          <div class="matching-ring" aria-hidden="true"><span></span></div>
          <p id="matchingLabel" class="matching-label">MATCHING...</p>
          <p id="greetingText" class="greeting-text"></p>
        </div>

        <button class="text-button back-home" type="button" data-action="home">← 返回主页</button>
      </div>
    </section>

    <section id="successView" class="view success-view" aria-labelledby="successTitle">
      <div class="success-card">
        <div class="success-topline">
          <img class="success-logo" src="./assets/logo.png" alt="RAP GOING" draggable="false" />
          <h2 id="successTitle" class="sr-only">你的专属邀请函</h2>
        </div>

        <button id="invitationImageButton" class="invitation-frame" type="button" aria-label="点击放大邀请函">
          <span class="image-shimmer" aria-hidden="true"></span>
          <img id="invitationImage" alt="专属邀请函" draggable="false" />
        </button>

        <p class="save-tip">点击图片放大 · 长按 / 截图保存邀请函</p>
        <button class="text-button" type="button" data-action="home">← 返回主页</button>
      </div>
    </section>

    <section id="notFoundView" class="view" aria-labelledby="notFoundTitle">
      <div class="not-found-card">
        <div class="cry-emoji" aria-hidden="true">🥺</div>
        <h2 id="notFoundTitle">抱歉哦宝宝，没有匹配到你的名字</h2>
        <p>请检查一下昵称有没有输错～</p>
        <p>这次没匹配到也没关系，欢迎下次一起来玩！</p>
        <button id="retryBtn" class="neon-button primary" type="button"><span>再试一次</span></button>
        <button class="text-button" type="button" data-action="home">← 返回主页</button>
      </div>
    </section>
  </main>

  <div id="imageModal" class="image-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="邀请函大图">
    <button id="closeModalBtn" class="modal-close" type="button" aria-label="关闭大图">×</button>
    <div class="modal-scroll">
      <img id="modalImage" alt="专属邀请函大图" draggable="false" />
    </div>
    <p class="modal-tip">长按图片可保存 · 双指可缩放页面</p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
